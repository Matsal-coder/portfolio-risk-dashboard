[project]
name = "portfolio-risk-dashboard"
version = "0.1.0"
description = "Educational multi-asset portfolio risk management system and dashboard."
authors = [
    {name = "Mateus Saldanha",email = "mateus.matsal@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "streamlit (>=1.64.0,<2.0.0)"
]


[tool.poetry]
packages = [
    { include = "portfolio_risk", from = "src" },
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.10,<0.17.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "dashboard"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]